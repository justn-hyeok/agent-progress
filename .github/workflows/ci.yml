name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-14
    env:
      HERDR_ENV: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: brew install fish tmux
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release
      - run: python3 scripts/pty_setup.py target/release/ap
      - run: python3 scripts/pty_presentation.py target/release/ap
      - run: python3 scripts/pty_terminal.py target/release/ap

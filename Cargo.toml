[package]
name = "agent-progress"
version = "3.0.0"
edition = "2024"
publish = false

[[bin]]
name = "ap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
libc = "0.2"
ratatui = { version = "=0.30.2", default-features = false, features = ["std", "crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-width = "0.2"
